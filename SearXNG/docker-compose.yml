services:

  redis:
    image: redis:alpine
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest

    ports:
      - "127.0.0.1:8081:8080"

    restart: unless-stopped

    environment:
      - BASE_URL=http://localhost:8081/

    volumes:
      - ./searxng:/etc/searxng

    depends_on:
      - redis